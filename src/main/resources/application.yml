spring:
  application:
    name: mfood-bot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mfood}
    username: ${DB_USER:mfood}
    password: ${DB_PASS:mfood}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:YOUR_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:YOUR_BOT_USERNAME}

edamam:
  app-id: ${EDAMAM_APP_ID:YOUR_EDAMAM_APP_ID}
  app-key: ${EDAMAM_APP_KEY:YOUR_EDAMAM_APP_KEY}
  food-db-base-url: ${EDAMAM_FOOD_DB_BASE_URL:https://api.edamam.com}
  vision-base-url: ${EDAMAM_VISION_BASE_URL:https://api.edamam.com}

click:
  provider-token: ${CLICK_PROVIDER_TOKEN:YOUR_CLICK_PROVIDER_TOKEN}

subscription:
  price-uzs: 13000
  monthly-days: 30
  renewal-reminder-days: 7

logging:
  level:
    com.mfood: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
